site_name: Vajra BM25
site_description: High-performance BM25 search engine with Category Theory abstractions
site_url: https://aiexplorations.github.io/vajra_bm25/
repo_url: https://github.com/aiexplorations/vajra_bm25
repo_name: aiexplorations/vajra_bm25

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - CLI Usage: getting-started/cli.md
  - User Guide:
    - Document Formats: guide/formats.md
    - Search Engines: guide/engines.md
    - BM25 Parameters: guide/parameters.md
    - Performance Tips: guide/performance.md
  - API Reference:
    - Documents: api/documents.md
    - Search Engines: api/search.md
    - Categorical: api/categorical.md
  - Benchmarks: benchmarks.md
  - Category Theory: category-theory.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aiexplorations/vajra_bm25
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vajra-bm25/
